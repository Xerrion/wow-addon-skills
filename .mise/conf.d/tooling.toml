# Generated by xerrion-dev-tooling; rerun with the complete tool selection.

[tasks."check:javascript"]
description = "Check lint and formatting with the project's Biome rules"
dir = "{{ vars.javascript_dir }}"
run = "biome check {{ vars.javascript_files }}"

[tasks."check:markdown"]
description = "Check Markdown with mise-managed markdownlint-cli2 and Prettier"
dir = "{{ vars.markdown_dir }}"
run = [
  "bun run --bun markdownlint-cli2 {{ vars.markdown_files }}",
  "bun run --bun prettier --check --ignore-path .gitignore --ignore-path .prettierignore {{ vars.markdown_files }}",
]

[tasks."check:shell"]
description = "Check shell scripts with ShellCheck"
dir = "{{ vars.shell_dir }}"
run = "shellcheck -- {{ vars.shell_files }}"

[tasks."deps:javascript"]
description = "Install locked JavaScript dependencies using Bun"
dir = "."
run = "bun ci"

[tasks."format:javascript"]
description = "Format files and apply Biome's safe fixes, including import organization"
dir = "{{ vars.javascript_dir }}"
run = "biome check --write {{ vars.javascript_files }}"

[tasks."format:markdown"]
description = "Format Markdown with mise-managed Prettier"
dir = "{{ vars.markdown_dir }}"
run = "bun run --bun prettier --write --ignore-path .gitignore --ignore-path .prettierignore {{ vars.markdown_files }}"

[tasks."test:javascript"]
description = "Run the package's test script"
dir = "{{ vars.javascript_dir }}"
run = "bun run test"

[tools]
biome = "2"
markdownlint-cli2 = "latest"
bun = "1.3.12"
prettier = "latest"
shellcheck = "latest"

[vars]
javascript_dir = "."
javascript_files = "."
markdown_dir = "."
markdown_files = "'**/*.md'"
shell_dir = "."
shell_files = "install.sh maintain-annotations.sh uninstall.sh"
